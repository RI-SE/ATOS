name: Clang

on: [pull_request]

jobs:
    build:
        uses: ./.github/workflows/build.yaml

    file-changes:
      runs-on: ubuntu-latest
      outputs:
        cpp: ${{ steps.cpp-files.outputs.CPP }}
      steps:
        - name: Check out repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # Added, copied, modified, renamed and type-changed C/C++ files in the PR
        # (deleted files can't be linted). Paths are taken from git directly, so
        # changed files with spaces in their names don't break the job.
        - name: Get changed cpp, hpp, c, and h files
          id: cpp-files
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          run: |
            cpp_files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.cpp' '*.hpp' '*.c' '*.h' | tr '\n' ' ')
            echo "Target files: $cpp_files"

            {
              echo 'CPP<<EOF'
              echo "$cpp_files"
              echo EOF
            } >> "$GITHUB_OUTPUT"

    clang-tidy:
        uses: ./.github/workflows/clang-tidy.yaml
        needs: [build, file-changes]
        with:
            target_files: ${{ needs.file-changes.outputs.cpp }}

    cppcheck:
        uses: ./.github/workflows/cppcheck.yaml
